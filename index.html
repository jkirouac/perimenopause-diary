<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6ecff" />
    <script>
      // Light unless Dark (or Match my phone) was chosen in Settings; see src/lib/theme.ts.
      // Runs before the page draws, so it never flashes the wrong colours.
      ;(function () {
        var pref = 'light'
        try {
          pref = localStorage.getItem('pd-theme') || 'light'
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.setAttribute('data-theme', 'dark')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#241a30' : '#f6ecff')
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ebb &amp; Flow" />
    <link rel="icon" type="image/svg+xml" href="/perimenopause-diary/favicon.svg" />
    <link rel="apple-touch-icon" href="/perimenopause-diary/apple-touch-icon.png" />
    <title>Ebb &amp; Flow · a perimenopause diary</title>
    <meta name="description" content="A calm evening check-in for perimenopause, based on CeMCOR's Daily Perimenopause Diary. Free, private, and made for cycles that don't follow a schedule." />
    <!-- Shared by link with friends and patients, so it stays out of search results. -->
    <meta name="robots" content="noindex" />
    <!-- Never tell other sites which page a visitor came from. -->
    <meta name="referrer" content="no-referrer" />
    <meta property="og:title" content="Ebb &amp; Flow · a perimenopause diary" />
    <meta property="og:description" content="A calm evening check-in for perimenopause, based on CeMCOR's Daily Perimenopause Diary. Free and private." />
    <meta property="og:image" content="https://jkirouac.github.io/perimenopause-diary/landing/og.png" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
